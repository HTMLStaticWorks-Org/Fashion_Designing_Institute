<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Couture Wing Opening Soon | Atelia</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="description" content="Atelia is unveiling a new Sustainable Textile & Runway Wing. Sign up for VIP showcase invitations.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .coming-soon-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
            background-color: var(--color-bg-primary);
            background-image: radial-gradient(circle at top right, var(--color-bg-secondary), transparent 40%), radial-gradient(circle at bottom left, rgba(197, 164, 109, 0.16), transparent 40%);
        }
        
        .cs-card {
            background: var(--color-bg-primary);
            padding: var(--space-8);
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--color-border);
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="coming-soon-page">
        <div class="cs-card">
            <a href="index.html" class="navbar-brand" style="justify-content: center; margin-bottom: var(--space-6);">
                <svg class="brand-logo" viewBox="0 0 200 60" preserveAspectRatio="xMinYMid meet" role="img"
                    aria-label="Atelia">
                    <title>Atelia</title>
                    <g transform="translate(4, 6)">
                        <rect x="2" y="2" width="44" height="44" rx="12" fill="#651C32" opacity="0.12" />
                        <rect x="2" y="2" width="44" height="44" rx="12" fill="none" stroke="#C5A46D"
                            stroke-width="1.6" />
                        <path d="M 24 8 L 36 24 L 24 40 L 12 24 Z" fill="none" stroke="#651C32" stroke-width="2"
                            stroke-linejoin="round" />
                        <path d="M 24 13 L 30 24 L 24 35 L 18 24 Z" fill="#651C32" />
                        <circle cx="24" cy="24" r="2.3" fill="#FAF7F2" />
                        <path d="M 10 24 L 38 24" stroke="#D9A6A8" stroke-width="1.4" stroke-linecap="round" />
                    </g>
                    <text class="brand-text" x="62" y="42" font-family="'Playfair Display','Georgia',serif"
                        font-weight="700" font-size="34" letter-spacing="-0.5" fill="currentColor">Atelia</text>
                </svg>
            </a>
            <h1 style="margin-bottom: var(--space-2);">A New Couture &amp; Textile Wing Is Opening Soon.</h1>
            <p style="color: var(--color-text-secondary); margin-bottom: var(--space-6);">Atelia is unveiling our expanded Sustainable Dye Lab and Runway Atrium. Leave your email to receive an invitation to the opening exhibition.</p>
            
            <form action="#" style="display: flex; gap: var(--space-2); max-width: 400px; margin: 0 auto var(--space-6);">
                <input type="email" class="form-control" placeholder="Enter your email address" required style="flex-grow: 1;">
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>
            
            <a href="index.html" style="color: var(--color-text-secondary); font-size: 0.875rem; text-decoration: underline;">&larr; Back to Institute Home</a>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
